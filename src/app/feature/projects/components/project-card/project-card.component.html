<article
  class="project-card"
  [class.project-card--featured]="isFeatured()"
  [attr.aria-label]="project().title + ' project card'"
>

  <!-- Featured badge -->
  @if (project().featured && isFeatured()) {
    <div class="project-card__badge" aria-label="Featured project">
      <span class="project-card__badge-dot" aria-hidden="true"></span>
      Featured
    </div>
  }

  <!-- Image / Screenshot -->
  <div class="project-card__image-wrapper">
    <div class="project-card__image-inner">
      <img
        class="project-card__image"
        [src]="project().image"
        [alt]="project().title + ' project preview'"
        loading="lazy"
        draggable="false"
      />
    </div>
    <div class="project-card__image-overlay" aria-hidden="true"></div>
    <span class="project-card__year" aria-label="Year">{{ project().year }}</span>
  </div>

  <!-- Content -->
  <div class="project-card__content">

    <span class="project-card__category">{{ project().category }}</span>

    <h3 class="project-card__title">{{ project().title }}</h3>

    <p class="project-card__description">{{ project().description }}</p>

    <!-- Technology badges — rendered from data, never hardcoded -->
    <div class="project-card__technologies" aria-label="Technologies used">
      @for (technology of project().technologies; track technology) {
        <span class="project-card__technology">{{ technology }}</span>
      }
    </div>

    <!-- Action buttons — only on featured (center) card -->
    @if (isFeatured()) {
      <div class="project-card__actions">
        <a
          class="project-card__action project-card__action--primary"
          [href]="project().liveUrl"
          target="_blank"
          rel="noopener noreferrer"
          [id]="'project-live-' + project().id"
          [attr.aria-label]="'View live demo of ' + project().title"
        >
          View Live Demo
          <span aria-hidden="true">→</span>
        </a>

        <a
          class="project-card__action project-card__action--secondary"
          [href]="project().githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          [id]="'project-code-' + project().id"
          [attr.aria-label]="'View source code of ' + project().title"
        >
          <svg
            class="project-card__action-icon"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          View Code
        </a>
      </div>
    }

  </div>
</article>
