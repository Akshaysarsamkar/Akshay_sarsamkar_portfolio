<article class="experience-card" [class.experience-card--current]="experience().current"
  [attr.aria-label]="experience().role + ' at ' + experience().company">
  <div class="experience-card__header">
    <div class="experience-card__identity">
      <div class="experience-card__logo" [innerHTML]="experience().logoSvg | safeHtml" aria-hidden="true"></div>
      <div class="experience-card__meta">
        <h3 class="experience-card__company">{{ experience().company }}</h3>
        <div class="experience-card__location">
          <svg class="experience-card__location-icon" viewBox="0 0 24 24" width="13" height="13" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <span>{{ experience().location }}</span>
        </div>
      </div>
    </div>
    @if (experience().current) {
    <div class="experience-card__status" aria-label="Current position">
      <span class="experience-card__status-dot" aria-hidden="true"></span>
      CURRENT
    </div>
    }
  </div>
  <h4 class="experience-card__role">{{ experience().role }}</h4>
  <p class="experience-card__description">{{ experience().description }}</p>

  <div class="experience-card__technologies" aria-label="Technologies used">
    @for (tech of experience().technologies; track tech?.name || $index) {
      @if (tech) {
        <span class="experience-card__technology" [attr.data-tech]="tech.name">
          @if (tech.iconSvg) {<span class="experience-card__tech-icon" [innerHTML]="tech.iconSvg | safeHtml"
            aria-hidden="true"></span> }
          <span class="experience-card__tech-name">{{ tech.name }}</span>
        </span>
      }
    }
  </div>

</article>
